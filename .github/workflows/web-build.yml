# کارخانه بیلد شرکت AI — قالب‌های GitHub Actions
# این پوشه شامل workflow های آماده برای ۴ بخش است.
# هر پروژه از این قالب‌ها استفاده می‌کند تا بیلد روی سرور ضعیف انجام نشود.

# ─────────────────────────────────────────────
# ۱) بیلد وب: deploy استاتیک به GitHub Pages
# ─────────────────────────────────────────────
name: web-build

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-build.yml']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: web
        run: |
          if [ -f package.json ]; then
            npm ci && npm run build
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment